# Runs the test suite and installs the PyPI package on Linux, macOS and Windows.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Core tests (standard library only)
        run: python -m unittest discover

      - name: All tests, with the MCP SDK
        if: ${{ !cancelled() }}  # a failing test must not hide whether the package works
        run: |
          python -m pip install -r requirements-mcp.txt
          python -m unittest discover

      - name: Build the package
        if: ${{ !cancelled() }}
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: Install the package in a clean environment and talk MCP to it
        if: ${{ !cancelled() }}
        run: |
          python -m venv pkg
          if [ "$RUNNER_OS" = "Windows" ]; then bin=pkg/Scripts; exe=.exe; else bin=pkg/bin; exe=; fi
          "$bin/python" -m pip install dist/*.whl
          "$bin/ihmt-memory$exe" --instructions | diff --strip-trailing-cr - templates/memory-instructions.md
          python .github/scripts/smoke_mcp.py "$bin/ihmt-memory$exe"
